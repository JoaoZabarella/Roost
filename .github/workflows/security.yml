name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependencies
        # Non-blocking until the repo has real dependency manifests
        # (Maven/npm) and the "Dependency graph" repo setting is enabled.
        # Remove continue-on-error once both are true, so this starts
        # gating merges.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
