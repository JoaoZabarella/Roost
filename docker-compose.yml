# Roost — local development stack.
#
# Backend runs on the host via `./gradlew bootRun` and connects to the
# containers below. Copy `.env.example` to `.env` first; values are read from
# there. Never commit `.env`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roost}
      POSTGRES_USER: ${POSTGRES_USER:-roost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bind to localhost only — never expose the database to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roost}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Require a password even locally; no unauthenticated Redis.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # Bind to localhost only — never expose Redis to the LAN.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Phase 2 (voice/video) ----
  # LiveKit SFU. Uncomment when Phase 2 starts. Requires LIVEKIT_API_KEY /
  # LIVEKIT_API_SECRET in .env and a livekit.yaml config next to this file.
  #
  # livekit:
  #   image: livekit/livekit-server:latest
  #   command: --config /etc/livekit.yaml
  #   ports:
  #     - "7880:7880"       # WebSocket / signaling
  #     - "7881:7881"       # RTC TCP
  #     - "7882:7882/udp"   # RTC UDP
  #   volumes:
  #     - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres-data:
  redis-data:
